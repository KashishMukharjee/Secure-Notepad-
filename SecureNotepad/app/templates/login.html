{% extends "base.html" %}
{% block title %}Login – SecureNotepad{% endblock %}

{% block content %}
<div style="max-width:420px; margin:3rem auto;">
  <div class="card">
    <div class="text-center" style="margin-bottom:1.8rem;">
      <div style="font-size:3rem;">🔐</div>
      <h1 style="font-size:1.6rem; margin-top:.5rem;">Welcome Back</h1>
      <p style="color:var(--muted); font-size:.9rem; margin-top:.3rem;">Sign in to your SecureNotepad</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier"
               placeholder="Enter username or email" required autofocus />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" name="password"
                 placeholder="Enter your password" required />
          <button type="button" onclick="togglePwd('password', this)"
                  style="position:absolute;right:.8rem;top:50%;transform:translateY(-50%);
                         background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;">
            👁
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top:.5rem;">
        🔓 Sign In
      </button>
    </form>

    <p class="text-center mt-3" style="font-size:.88rem; color:var(--muted);">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" style="color:var(--accent2);">Create one</a>
    </p>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}
</script>
{% endblock %}
